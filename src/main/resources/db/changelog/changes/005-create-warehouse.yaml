databaseChangeLog:
  - changeSet:
      id: 1
      author: asror
      changes:
        - createTable:
            tableName: warehouse
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValueBoolean: false


              - column:
                  name: name
                  type: varchar
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: address
                  type: varchar
              - column:
                  name: active
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValueBoolean: true
