databaseChangeLog:
  - changeSet:
      id: 1
      author: asror
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValueBoolean: false


              - column:
                  name: name
                  type: varchar
                  constraints:
                    nullable: false
              - column:
                  name: sku
                  type: varchar
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: description
                  type: varchar
              - column:
                  name: active
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValueBoolean: true

              - column:
                  name: supplier_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_product_supplier
                    references: supplier(id)
              - column:
                  name: category_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_product_category
                    references: supplier(id)