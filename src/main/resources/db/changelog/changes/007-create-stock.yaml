databaseChangeLog:
  - changeSet:
      id: 1
      author: asror
      changes:
        - createTable:
            tableName: stock
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValueBoolean: false


              - column:
                  name: product_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_stock_product
                    references: product(id)
              - column:
                  name: warehouse_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_stock_warehouse
                    references: warehouse(id)
              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: reserved_quantity
                  type: int
                  constraints:
                    nullable: false
