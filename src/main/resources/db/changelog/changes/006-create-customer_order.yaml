databaseChangeLog:
  - changeSet:
      id: 1
      author: asror
      changes:
        - createTable:
            tableName: customer_order
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValueBoolean: false


              - column:
                  name: order_number
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_customer_order_customer
                    references: customer(id)
              - column:
                  name: warehouse_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_customer_order_warehouse
                    references: warehouse(id)
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: number(10, 2)