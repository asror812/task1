databaseChangeLog:
  - changeSet:
      id: 1
      author: asror
      changes:
        - createTable:
            tableName: supplier
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValueBoolean: false


              - column:
                  name: name
                  type: varchar
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar
              - column:
                  name: phone
                  type: varchar


  - changeSet:
      id: 2
      author: asror
      changes:
        - sql:
            sql:
              CREATE UNIQUE INDEX uk_supplier_email
              ON supplier(lower(email)) 
              WHERE deleted = false AND email IS NOT NULL

