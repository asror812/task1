spring:
  application:
    name: order_management


  datasource:
    username: postgres
    password:
    url: jdbc:postgresql://localhost:5432/order_management

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

    properties:
      hibernate:
        format_sql: true
        generate_statistics: true


  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/order-management